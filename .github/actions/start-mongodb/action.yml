name: Start MongoDB replica set
description: >-
  Start a single-node MongoDB replica set in Docker and wait for it to become
  PRIMARY. Inline replacement for supercharge/mongodb-github-action, which
  cannot pass the GLIBC_TUNABLES workaround (mongodb-extra-env is unreleased).
  mongod 8.0 crashes at startup on ubuntu-latest (Ubuntu 26.04 runner images)
  without it; see supercharge/mongodb-github-action#81 and
  https://jira.mongodb.org/browse/SERVER-121912.

inputs:
  version:
    description: MongoDB image tag.
    default: "8.0"
  replica_set:
    description: Replica set name.
    default: test-rs

outputs:
  uri:
    description: Connection string for the replica set.
    value: mongodb://localhost:27017/?replicaSet=${{ inputs.replica_set }}

runs:
  using: composite
  steps:
    - name: Start MongoDB ${{ inputs.version }}
      shell: bash
      env:
        MONGODB_VERSION: ${{ inputs.version }}
        REPLICA_SET: ${{ inputs.replica_set }}
      run: |
        set -eu
        docker run -d --name mongodb -p 27017:27017 \
          -e GLIBC_TUNABLES=glibc.pthread.rseq=1 \
          "mongo:${MONGODB_VERSION}" --replSet "${REPLICA_SET}" --bind_ip_all

        fail_if_exited() {
          if [ "$(docker inspect -f '{{.State.Running}}' mongodb)" != "true" ]; then
            docker logs mongodb
            exit 1
          fi
        }

        # Wait for mongod to accept connections.
        for _ in $(seq 1 30); do
          fail_if_exited
          if docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then
            break
          fi
          sleep 1
        done

        docker exec mongodb mongosh --quiet --eval \
          "rs.initiate({_id: '${REPLICA_SET}', members: [{_id: 0, host: 'localhost:27017'}]})"

        # Wait for the replica set to reach PRIMARY state.
        for _ in $(seq 1 30); do
          fail_if_exited
          if docker exec mongodb mongosh --quiet --eval \
            "try { rs.status().myState } catch (e) { 0 }" | grep -q 1; then
            exit 0
          fi
          sleep 1
        done
        echo "::error::Replica set did not reach PRIMARY within 30 seconds"
        docker logs mongodb
        exit 1
