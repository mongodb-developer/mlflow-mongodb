minimum_pre_commit_version: 4.0.1
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b # v4.5.0
    hooks:
      - id: trailing-whitespace
        files: \.(mdx|ya?ml|txt)$
      - id: end-of-file-fixer
        files: \.(txt|sh|rst)$
      - id: check-vcs-permalinks
        files: \.py$
        require_serial: true

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "50c5478ed9e10bf360335449280cf2a67f4edb7a" # v2.7.1
    hooks:
      - id: prettier
        files: '.+\.(js|ts|md|json|ya?ml)$'
        require_serial: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        name: ruff
        args: [--fix, --exit-non-zero-on-fix]
        require_serial: true
      - id: ruff-format
        name: format
        files: '\.(py|ipynb|md|mdx)$'
        require_serial: true

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
      - id: check-github-actions

  # MLflow does not publish a reusable .pre-commit-hooks.yaml manifest. These
  # small project-specific checks are therefore reproduced as local hooks.
  - repo: local
    hooks:
      - id: must-have-signoff
        name: must-have-signoff
        entry: 'grep "Signed-off-by:"'
        language: system
        stages: [prepare-commit-msg]
        require_serial: true

      - id: forbid-gif
        name: forbid-gif
        language: fail
        entry: "Please use MP4 instead of GIF for docs animations"
        files: ^docs/.*\.gif$
        stages: [pre-commit]

      - id: no-yaml
        name: no-yaml
        language: fail
        entry: "Use .yml instead of .yaml"
        files: ^\.github/(workflows|actions)/.*\.yaml$
        stages: [pre-commit]

      - id: no-spaces
        name: no-spaces
        language: fail
        entry: "Filenames must not contain spaces"
        files: " "
